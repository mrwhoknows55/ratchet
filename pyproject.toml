[project]
name = "ratchet"
version = "0.1.0"
description = "AI harness written in Python for local models via LM Studio"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "textual>=8.2.8",
    "httpx>=0.28.0",
]

[project.scripts]
ratchet = "ratchet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
